[pytest]
# Collect only this repository's tests; the lerobot/ subtree tests belong to the
# vendored fork, depend on upstream test fixtures (removed) and are unrelated to
# this project's training/deployment validation.
# To run the lerobot subtree tests, clone the upstream repository separately.
testpaths = tests
# conftest redirects the HF cache directory; lerobot's doctest conftest does not
# apply to this repository.
addopts = -p no:cacheprovider
